version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: abhiyan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: abhiyan_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: abhiyan-redis
    ports:
      - "6381:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker
    environment:
      # Notice these use the internal Docker service names, not localhost!
      - DB_URL=postgres://postgres:password@postgres:5432/abhiyan_dev?sslmode=disable
      - BROKER_URL=redis:6379
      - DASHBOARD_URL=:8081
    ports:
      - "8081:8081" # Expose the Onion dashboard
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
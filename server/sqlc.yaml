version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/query"
    schema: "internal/db/schemas"
    gen:
      go:
        package: "db" # The Go package name
        out: "internal/db/sqlc"
        emit_json_tags: true # Automatically adds JSON tags to your structs (great for APIs)
        emit_prepared_queries: false
        emit_interface: true # Generates an interface for easy mocking in unit tests
        emit_exact_table_names: false